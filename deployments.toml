# Every live deployment of the engine, with the exact revision a release is tested against.
# status "supported": its contract test is required; a missing checkout, a revision mismatch, a skip or a
# failure fails the release check. status "not-yet-supported": listed with the reason, excluded from the gate,
# and named as unsupported in the release notes.

[deployments.statarb]
status = "supported"
checkout = "../statarb"
revision = "f03e35c692d59d1659f74c871043643c86bd9252"
clean_paths = ["arxiv_drip/research_protocol.py", "arxiv_drip/research-brief.md", "arxiv_drip/engine_calls.py"]   # what the contract runs
contract = "tests/test_deployments.py::test_statarb_prepares_freezes_and_runs_the_candidate_engine"
notes = "The real statarb adapter freezes the candidate commit with pathfinder freeze, verifies it, and its worker runs research and edit on the stub backend; statarb pins engine-v1.3.4 and makes its own scan, implementation and review calls through the engine (arxiv_drip/engine_calls.py) on the shared codex-subscription seats; its watchboard content is available as panels of the engine's operator page (python -m arxiv_drip view)."

[deployments.coordinated-pilot]
status = "supported"
checkout = "."
revision = "candidate"
clean_paths = []
contract = "tests/test_coordinator.py"
notes = "The repeat and reinjection pilot's schedule semantics, now pathfinder coordinate; its archived run keeps its own frozen engine."

[deployments.pilot-10x10]
status = "supported"
checkout = "."
revision = "candidate"
clean_paths = []
contract = "tests/test_deployments.py::test_the_10x10_pilot_replays_on_the_candidate_engine"
notes = "The pilot campaign at the repository root (10 mechanism-design by 10 agentic-cooperation papers, 100 scored pairs, 14 threads, September 2026); finished, so its contract is a read-only replay: the candidate engine loads it and builds its state and health with the recorded outcomes. experiments/ holds archived runs with their own frozen engines, outside the gate."

[deployments.pathfinder-julien-2]
status = "not-yet-supported"
checkout = "../pathfinder-julien-2"
revision = "c59af4a"
clean_paths = []
contract = ""
notes = "Julien's campaign 2 (eva-top-ten-01, ten pairs, three-branch EVA with PCE editing) is finished; its engine record is canon/, made by pathfinder import-eva2 (accepted PCE accounts as edited notes, 435 receipts). Its controller (eva2: dispatch, retries, per-stage routing) and PCE editing are still julien-2 code on a patched engine copy; how they come under the engine is open (see notes/pathfinder-friction.tex)."

[deployments.prooftree]
status = "not-yet-supported"
checkout = "../proofTree"
revision = "c16180d"
clean_paths = []
contract = ""
notes = "Editable dependency on ../pathfinder. Its own suite (31 tests) passes against the engine-v1.2 candidate, which keeps pathfinder.scan.parse_json and reads research_scheme eva_minus as direct_eva with a deprecation warning; its working tree is under active development, so no contract is pinned yet."

[deployments.agqsl]
status = "supported"
checkout = "../agQSL"
revision = "7c129f38174f0fa2d4074374cdab10d6b526280a"
clean_paths = ["canon"]
contract = "tests/test_deployments.py::test_agqsl_canon_replays_on_the_candidate_engine"
notes = "Campaign repository: canon/ is a canonical campaign of agQSL's five open pairs (two papers accepted, three paused for inputs the sources lack), run by hand on a frozen engine-v1.3.5 (canon/engine-ref). The contract replays it read-only on the candidate engine and checks that its prompt overlays compose."
