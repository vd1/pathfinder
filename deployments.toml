# Every live deployment of the engine, with the exact revision a release is tested against.
# status "supported": its contract test is required; a missing checkout, a revision mismatch, a skip or a
# failure fails the release check. status "not-yet-supported": listed with the reason, excluded from the gate,
# and named as unsupported in the release notes.

[deployments.statarb]
status = "supported"
checkout = "../statarb"
revision = "a988c4850181fa4a11aabbedcd80214b12e83ba2"
clean_paths = ["arxiv_drip/research_protocol.py", "arxiv_drip/research-brief.md", "arxiv_drip/engine_calls.py"]   # what the contract runs
contract = "tests/test_deployments.py::test_statarb_prepares_freezes_and_runs_the_candidate_engine"
notes = "The real statarb adapter freezes the candidate commit with pathfinder freeze, verifies it, and its worker runs research and edit on the stub backend; statarb pins engine-v1.4.7 and makes its own scan, implementation and review calls through the engine (arxiv_drip/engine_calls.py) on the shared codex-subscription seats; its watchboard content is available as panels of the engine's operator page (python -m arxiv_drip view)."

[deployments.coordinated-pilot]
status = "supported"
checkout = "."
revision = "candidate"
clean_paths = []
contract = "tests/test_coordinator.py"
notes = "The repeat and reinjection pilot's schedule semantics, now pathfinder coordinate; its archived run keeps its own frozen engine."

[deployments.pilot-10x10]
status = "supported"
checkout = "."
revision = "candidate"
clean_paths = []
contract = ["tests/test_deployments.py::test_the_10x10_pilot_replays_on_the_candidate_engine", "tests/test_deployments.py::test_a_study_under_the_10x10_pilot_runs_on_the_candidate_engine"]
notes = "The pilot campaign at the repository root (10 mechanism-design by 10 agentic-cooperation papers, 100 scored pairs, 14 threads, September 2026); open for further studies (child campaigns under it); its contract replays its record read-only and runs one study under it through research, editing and the paper on the stub backend. experiments/ holds archived runs with their own frozen engines, outside the gate."

[deployments.pathfinder-julien-2]
status = "supported"
checkout = "../pathfinder-julien-2"
revision = "022e13f626fded2c329ffd7c21c98df05287fb33"
clean_paths = ["campaign/campaign.json", "campaign/prompts", "campaign/engine-ref"]   # the contracts read campaign/ and canon/ as committed
contract = ["tests/test_deployments.py::test_julien2_canon_replays_on_the_candidate_engine", "tests/test_deployments.py::test_a_julien2_shortlisted_pair_runs_composable_research_pce_and_actionability_on_the_candidate_engine"]
notes = "Julien's campaign 2, a plain deployment since its controller (eva2, julien2), patched engine copy and vendored PCE were removed (tag pre-pathfinder-roof in that repository). canon/ is the record of the finished eva-top-ten-01 (ten one-pair composable campaigns made by import-eva2: seven DRAFT, three PAUSE, PCE edits done, actionability NEEDS_INPUTS); campaign/ is the next campaign on a frozen engine-v1.4.5 (campaign/engine-ref): composable research with three branches, edit_scheme pce, actionability, two paper reviewers, routes to Claude Opus 5.5 for verification, ledger review, actionability and reviewer 1, and the next ten pairs of its saved scan as the shortlist, not yet run. The contract replays canon/ read-only and runs one shortlisted pair of campaign/ through composable research, PCE editing and actionability on the stub backend, checking that its prompt overlays reach the calls."

[deployments.prooftree]
status = "supported"
checkout = "../proofTree"
revision = "4b601ade8a6ccb6e78d106341f06050efc6fdf87"
clean_paths = ["prooftree", "pyproject.toml", "uv.lock", "campaigns/sphere-packing-rounds2/adaptive"]   # what the contract runs and replays
contract = "tests/test_deployments.py::test_prooftree_researches_a_link_on_the_candidate_engine"   # and ::test_prooftree_recorded_campaign_replays_read_only_on_the_candidate_engine
notes = "Editable dependency on ../pathfinder; imports only from the canonical engine (no julien-2 code). Each link is one composable campaign (three direct-EVA branches, a joint thread, editing) run by research.run_thread and edit.run; links recorded in eva2's layout are read through import_eva2.verify_bundle, never resumed. arXiv queries go through corpus.query (429 back-off), Codex isolation through pathfinder.sandbox. 41 tests. The contract researches one link on the stub backend; a read-only replay of sphere-packing-rounds2 (tests/test_deployments.py) needs its untracked run data and is outside the gate."


[deployments.agqsl]
status = "supported"
checkout = "../agQSL"
revision = "3a62692f6554c1f30d0443a77e9e80005d96e4a2"
clean_paths = ["canon/campaign.json", "canon/prompts", "canon/engine-ref", "canon/import_campaign2.py"]   # the contracts read canon/ as committed; a live run changes the rest
contract = ["tests/test_deployments.py::test_agqsl_canon_replays_on_the_candidate_engine", "tests/test_deployments.py::test_an_imported_agqsl_pair_researches_and_edits_on_the_candidate_engine"]
notes = "Campaign repository: canon/ is a canonical campaign on a frozen engine-v1.4.7 (canon/engine-ref): five pairs continued from phase_e_prime (two papers accepted, three paused) and the second campaign's open triplets imported by canon/import_campaign2.py in Phase D grade order (WIN, HOLD, PARK; DROP never), first batch Q6P6 to Q25P25. The contract replays the record read-only, checks that its prompt overlays compose, and runs one imported pair through research and editing on the stub backend."
