[project]
name = "pathfinder"
version = "0.1.0"
description = "Scan every pair of two paper corpora, research the shortlist with peer agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pathfinder = "pathfinder.cli:main"

[dependency-groups]
dev = [
    "behave>=1.3",
    "pytest>=8",
    "pytest-cov>=7",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathfinder"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "pathfinder/resources/prompts"

# The engine suite. Handoff proofs under operator-log/ and agents' files under experiments/ are not collected.
[tool.pytest.ini_options]
testpaths = ["tests"]
